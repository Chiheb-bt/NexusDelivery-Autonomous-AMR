name: NexusDelivery Autonomy CI

on:
  push:
    branches: [ main, master, devel/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Autonomous Stack Unit Tests (75 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pure Python & Computer Vision Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Core Unit Test Suite
        run: |
          python -m unittest discover -s delivery_robot_sim/tests -p 'test_*.py' -v

      - name: Validate System Status Integrity
        run: |
          python -c "import json; d = json.load(open('PROJECT_STATUS.json')); assert d['project_name'], 'Valid project_name required'"
