<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#ca8a04"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="80%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>
    <linearGradient id="cremaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad)"/>

  <!-- Coffee Coaster / Slate Base -->
  <ellipse cx="300" cy="305" rx="140" ry="24" fill="#090d16" opacity="0.8"/>

  <!-- Tall Glass Tumbler with Nitro Cold Brew -->
  <g filter="url(#shadow)">
    <!-- Liquid Silhouette -->
    <path d="M 235,95 L 245,290 C 245,302 355,302 355,290 L 365,95 Z" fill="url(#coffeeGrad)"/>

    <!-- Cascading Nitro Cream Waves (Microfoam Effect) -->
    <path d="M 238,105 Q 270,140 280,190 Q 290,130 330,150 Q 350,110 362,105 Z" fill="#fde047" opacity="0.45"/>
    <path d="M 245,120 Q 275,170 290,220 Q 305,170 345,180 Q 355,140 360,120 Z" fill="#fef08a" opacity="0.25"/>

    <!-- Clear Dimensional Ice Cubes Inside Glass -->
    <!-- Cube 1 -->
    <g transform="translate(265, 120)">
      <polygon points="10,0 50,5 60,35 20,30" fill="#ffffff" opacity="0.45"/>
      <polygon points="50,5 60,35 50,55 40,25" fill="#e2e8f0" opacity="0.3"/>
      <polygon points="10,0 20,30 10,50 0,20" fill="#f8fafc" opacity="0.5"/>
    </g>
    <!-- Cube 2 -->
    <g transform="translate(285, 175) rotate(15)">
      <polygon points="10,0 45,5 55,30 15,25" fill="#ffffff" opacity="0.4"/>
      <polygon points="10,0 15,25 5,45 0,20" fill="#f8fafc" opacity="0.45"/>
    </g>

    <!-- Thick Golden Crema Head at Rim -->
    <ellipse cx="300" cy="95" rx="65" ry="14" fill="url(#cremaGrad)"/>
    <ellipse cx="300" cy="94" rx="60" ry="11" fill="#fffbeb" opacity="0.85"/>

    <!-- Glassware Body & Highlights -->
    <path d="M 232,85 L 243,293 C 243,306 357,306 357,293 L 368,85 Z" fill="url(#glassGrad)"/>
    
    <!-- Glass Rim -->
    <ellipse cx="300" cy="85" rx="68" ry="14" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

    <!-- Condensation Droplets Running Down Glass -->
    <circle cx="248" cy="140" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="250" cy="180" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="251" cy="220" r="3.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="348" cy="160" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="347" cy="210" r="2.5" fill="#ffffff" opacity="0.65"/>
    <circle cx="345" cy="250" r="3.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Roasted Whole Coffee Beans on Table -->
  <g transform="translate(180, 295)">
    <ellipse cx="15" cy="10" rx="10" ry="6" fill="#451a03" transform="rotate(-20 15 10)"/>
    <path d="M 9,7 Q 15,10 21,13" stroke="#1c0a02" stroke-width="1.8" fill="none"/>
  </g>
  <g transform="translate(390, 290)">
    <ellipse cx="15" cy="10" rx="11" ry="7" fill="#451a03" transform="rotate(35 15 10)"/>
    <path d="M 8,8 Q 15,10 22,12" stroke="#1c0a02" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Temperature & Category Badge -->
  <g transform="translate(420, 20)">
    <rect width="160" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f59e0b"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">☕ NITRO INFUSED</text>
  </g>
</svg>
