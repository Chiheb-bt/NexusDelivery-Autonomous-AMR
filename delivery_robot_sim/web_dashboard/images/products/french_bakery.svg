<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="croissantGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="chocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#290e02"/>
      <stop offset="100%" stop-color="#140601"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad)"/>

  <!-- Bakery Display Board / Kraft Parchment -->
  <g filter="url(#shadow)">
    <!-- Wooden Tray -->
    <rect x="80" y="60" width="440" height="240" rx="18" fill="url(#trayGrad)"/>
    <!-- Kraft Baking Liner -->
    <rect x="94" y="74" width="412" height="212" rx="10" fill="#fef3c7" opacity="0.9"/>
    <!-- Subtle Parchment Border Lines -->
    <rect x="100" y="80" width="400" height="200" rx="6" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

    <!-- Pastry 1: Golden Flaky Butter Croissant (Left) -->
    <g transform="translate(130, 95)">
      <!-- Main Curved Body -->
      <path d="M 30,120 C 10,70 50,20 100,20 C 150,20 190,70 170,120 C 145,95 125,75 100,75 C 75,75 55,95 30,120 Z" fill="url(#croissantGrad)"/>
      <!-- Inner Puff Rolls / Ribs -->
      <path d="M 60,65 C 80,45 120,45 140,65" stroke="#78350f" stroke-width="3.5" fill="none" opacity="0.85"/>
      <path d="M 75,85 C 90,70 110,70 125,85" stroke="#78350f" stroke-width="3" fill="none" opacity="0.8"/>
      <!-- Butter Glaze Sheen -->
      <ellipse cx="100" cy="35" rx="30" ry="10" fill="#ffffff" opacity="0.4"/>
      <ellipse cx="65" cy="65" rx="12" ry="5" fill="#ffffff" opacity="0.3"/>
      <!-- Flaky Flakes -->
      <circle cx="50" cy="110" r="2" fill="#d97706"/>
      <circle cx="150" cy="110" r="2.5" fill="#b45309"/>
      <circle cx="100" cy="105" r="1.5" fill="#d97706"/>
    </g>

    <!-- Pastry 2: Pain au Chocolat (Top Right) -->
    <g transform="translate(325, 95)">
      <!-- Pastry Roll -->
      <rect x="10" y="10" width="135" height="75" rx="18" fill="url(#croissantGrad)"/>
      <!-- Chocolate Batons Peeking Out -->
      <rect x="0" y="32" width="18" height="14" rx="4" fill="url(#chocGrad)"/>
      <rect x="0" y="52" width="18" height="14" rx="4" fill="url(#chocGrad)"/>
      <rect x="137" y="32" width="18" height="14" rx="4" fill="url(#chocGrad)"/>
      <rect x="137" y="52" width="18" height="14" rx="4" fill="url(#chocGrad)"/>
      <!-- Top Score Cuts -->
      <path d="M 40,15 Q 50,45 40,75" stroke="#78350f" stroke-width="3" fill="none" opacity="0.85"/>
      <path d="M 75,15 Q 85,45 75,75" stroke="#78350f" stroke-width="3" fill="none" opacity="0.85"/>
      <path d="M 110,15 Q 120,45 110,75" stroke="#78350f" stroke-width="3" fill="none" opacity="0.85"/>
      <!-- Glaze Sheen -->
      <ellipse cx="78" cy="22" rx="40" ry="8" fill="#ffffff" opacity="0.35"/>
    </g>

    <!-- Pastry 3: Almond Danish Pastry (Bottom Right) -->
    <g transform="translate(325, 185)">
      <!-- Danish Swirl -->
      <ellipse cx="75" cy="45" rx="65" ry="36" fill="url(#croissantGrad)"/>
      <ellipse cx="75" cy="45" rx="35" ry="18" fill="#d97706"/>
      <!-- Sliced Toasted Almonds -->
      <ellipse cx="55" cy="35" rx="12" ry="6" fill="#fef08a" stroke="#b45309" stroke-width="1" transform="rotate(-25 55 35)"/>
      <ellipse cx="85" cy="38" rx="14" ry="7" fill="#fef08a" stroke="#b45309" stroke-width="1" transform="rotate(30 85 38)"/>
      <ellipse cx="70" cy="55" rx="12" ry="6" fill="#fef08a" stroke="#b45309" stroke-width="1" transform="rotate(-10 70 55)"/>
      <ellipse cx="105" cy="48" rx="10" ry="5" fill="#fef08a" stroke="#b45309" stroke-width="1" transform="rotate(45 105 48)"/>
      <!-- Powdered Sugar Dusting -->
      <circle cx="60" cy="25" r="1.5" fill="#ffffff"/>
      <circle cx="75" cy="20" r="2" fill="#ffffff"/>
      <circle cx="90" cy="28" r="1.5" fill="#ffffff"/>
      <circle cx="70" cy="40" r="1.5" fill="#ffffff"/>
      <circle cx="80" cy="48" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- Temperature & Category Badge -->
  <g transform="translate(420, 20)">
    <rect width="160" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f59e0b"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">🥐 WARM BAKED</text>
  </g>
</svg>
