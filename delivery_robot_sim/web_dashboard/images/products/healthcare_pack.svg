<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad)"/>

  <!-- High-Tech Emergency First Aid Case -->
  <g filter="url(#shadow)">
    <!-- Main Hard Case Shell -->
    <rect x="150" y="70" width="300" height="210" rx="24" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Heavy-Duty Carry Handle -->
    <path d="M 230,70 L 230,45 C 230,36 370,36 370,45 L 370,70" fill="none" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>
    <path d="M 230,70 L 230,45 C 230,36 370,36 370,45 L 370,70" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- Central Recessed Cross Emblem -->
    <rect x="230" y="115" width="140" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Medical Cross -->
    <path d="M 285,135 H 315 V 160 H 340 V 190 H 315 V 215 H 285 V 190 H 260 V 160 H 285 Z" fill="url(#crossGrad)"/>

    <!-- Aluminum Corner Bumpers & Latches -->
    <rect x="150" y="70" width="28" height="28" rx="8" fill="#64748b"/>
    <circle cx="162" cy="82" r="4" fill="#cbd5e1"/>
    
    <rect x="422" y="70" width="28" height="28" rx="8" fill="#64748b"/>
    <circle cx="438" cy="82" r="4" fill="#cbd5e1"/>

    <rect x="150" y="252" width="28" height="28" rx="8" fill="#64748b"/>
    <circle cx="162" cy="268" r="4" fill="#cbd5e1"/>

    <rect x="422" y="252" width="28" height="28" rx="8" fill="#64748b"/>
    <circle cx="438" cy="268" r="4" fill="#cbd5e1"/>

    <!-- Dual Steel Latches -->
    <rect x="195" y="160" width="16" height="30" rx="4" fill="#475569"/>
    <rect x="197" y="164" width="12" height="10" rx="2" fill="#94a3b8"/>

    <rect x="389" y="160" width="16" height="30" rx="4" fill="#475569"/>
    <rect x="391" y="164" width="12" height="10" rx="2" fill="#94a3b8"/>

    <!-- Smart Autonomous Telemetry Status Strip -->
    <rect x="180" y="246" width="240" height="22" rx="6" fill="#0f172a"/>
    <circle cx="196" cy="257" r="4" fill="#10b981"/>
    <text x="208" y="261" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a7f3d0">SEALED & STERILIZED • 21°C OK</text>
  </g>

  <!-- Digital Clinical Thermometer -->
  <g transform="translate(60, 220) rotate(-25)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="150,5 175,11 150,17" fill="#cbd5e1"/>
    <rect x="50" y="4" width="46" height="14" rx="3" fill="#0284c7"/>
    <text x="54" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">36.6°C</text>
  </g>

  <!-- Temperature & Category Badge -->
  <g transform="translate(420, 20)">
    <rect width="160" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f43f5e"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">💊 EMERGENCY READY</text>
  </g>
</svg>
